[package]
name = "gloton"
version = "0.1.0"
authors = ["Alex Torres <me@alextorresruiz.xyz>"]
edition = "2024"
rust-version = "1.98.1"
description = "An early-stage CLI for organizing repository collections across Git hosting platforms."
license = "MIT"
repository = "https://github.com/Excoriate/gloton"
readme = "README.md"
publish = false

resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
